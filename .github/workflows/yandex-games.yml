name: Yandex Games archive

# Builds the archive to upload in the Yandex Games developer console.
# Independent of the web deploy: run it by hand (Actions → Yandex Games
# archive → Run workflow) or push a tag such as `yandex-v0.2.0`.
on:
  workflow_dispatch:
  push:
    tags: ['yandex-v*']

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build:yandex
      - uses: actions/upload-artifact@v4
        with:
          name: qybeq-yandex-games
          path: release/*.zip
          if-no-files-found: error
